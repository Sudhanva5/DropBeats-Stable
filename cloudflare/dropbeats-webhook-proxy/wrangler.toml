name = "dropbeats-webhook-proxy"
main = "src/worker.ts"

# Pinned deliberately. This Worker was first deployed to the Scaler work
# account (llm.experiments@scaler.com) purely because that was the logged-in
# wrangler session, which would have left a personal paid product depending on
# an employer's account — and its hostname baked into a signed DMG. Pinning the
# account makes a deploy to the wrong one fail loudly instead of silently
# succeeding. This is Sudhanva's personal Cloudflare account.
account_id = "f7e01432d43deb5ecdfe48a31ba336bc"
# Request-body streaming (`duplex: 'half'`) needs no compatibility flag: the
# constructors it relies on became default behaviour on 2022-11-30, and naming
# the old flag is now a hard startup error.
compatibility_date = "2024-01-18"

workers_dev = true

[vars]
# Railway origin. Kept as a variable so the backend can be repointed without a
# code change or a new Worker deploy of substance.
ORIGIN_URL = "https://dropbeats-server-production.up.railway.app"

[observability.logs]
enabled = true

[dev]
port = 8787
local_protocol = "http"
